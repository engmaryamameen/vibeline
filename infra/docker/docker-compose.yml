services:
  web:
    build:
      context: ../../
      dockerfile: infra/docker/web.Dockerfile
    environment:
      INTERNAL_API_URL: http://server:5001
    ports:
      - '3000:3000'
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ../../
      dockerfile: infra/docker/server.Dockerfile
    env_file:
      - ../../.env
    ports:
      - '5001:5001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped 

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - vibeline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vibeline']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vibeline-postgres:
